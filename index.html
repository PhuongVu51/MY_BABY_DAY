<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vault Deep Access // Babi.OS</title>
    <!-- Liên kết đến file CSS bên ngoài -->
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Các ngôi sao lấp lánh background (Blink blink) -->
    <div class="stars-container">
        <div class="star" style="top: 10%; left: 15%; animation-delay: 0s;"></div>
        <div class="star" style="top: 25%; left: 80%; animation-delay: 1.2s;"></div>
        <div class="star" style="top: 70%; left: 10%; animation-delay: 0.5s;"></div>
        <div class="star" style="top: 85%; left: 85%; animation-delay: 2s;"></div>
        <div class="star" style="top: 40%; left: 5%; animation-delay: 1.5s;"></div>
        <div class="star" style="top: 15%; left: 60%; animation-delay: 0.8s;"></div>
        <div class="star" style="top: 60%; left: 90%; animation-delay: 1.8s;"></div>
    </div>

    <div class="vault-wrapper">
        <!-- Main Title -->
        <h1 class="welcome-title">
            <span class="title-text">Happy My Babi's Day</span>
            <span class="title-icons">
                <span class="blue-icon" aria-hidden="true">💙</span>
                <span class="sparkle-icon" aria-hidden="true">✨</span>
            </span>
        </h1>
        <p class="subtitle">Nhập mật mã để mở khóa trang dành riêng cho anh iu.</p>

        <!-- Pincode Display Indicators -->
        <div class="pincode-dots">
            <span class="dot-pin" id="p1"></span>
            <span class="dot-pin" id="p2"></span>
            <span class="dot-pin" id="p3"></span>
            <span class="dot-pin" id="p4"></span>
            <span class="dot-pin" id="p5"></span>
            <span class="dot-pin" id="p6"></span>
        </div>

        <!-- Keypad Grid -->
        <div class="keypad-grid" id="keypad">
            <button class="key" data-val="1">1<small>ABC</small></button>
            <button class="key" data-val="2">2<small>DEF</small></button>
            <button class="key" data-val="3">3<small>GHI</small></button>
            <button class="key" data-val="4">4<small>JKL</small></button>
            <button class="key" data-val="5">5<small>MNO</small></button>
            <button class="key" data-val="6">6<small>PQR</small></button>
            <button class="key" data-val="7">7<small>STUV</small></button>
            <button class="key" data-val="8">8<small>WXYZ</small></button>
            <button class="key" data-val="9">9<small></small></button>
            <button class="key hint-key" data-val="hint">💙<small></small></button>
            <button class="key" data-val="0">0<small></small></button>
            <button class="key del-key" data-val="del">⌫<small>DEL</small></button>
        </div>

        <div class="status-text" id="statusMsg">Sẵn sàng xác thực mật mã...</div>

        <!-- Submit Button -->
        <button class="unlock-btn" id="unlockBtn">
            Mở Khóa
        </button>
    </div>

    <!-- Script xử lý tương tác bàn phím -->
    <script>
        let currentPin = "";
        let isAuthenticating = false;
        const maxLen = 6;
        const validPins = ["150306", "050105"];

        const dots = [
            document.getElementById('p1'),
            document.getElementById('p2'),
            document.getElementById('p3'),
            document.getElementById('p4'),
            document.getElementById('p5'),
            document.getElementById('p6')
        ];

        function updateDots() {
            dots.forEach((dot, index) => {
                if (index < currentPin.length) {
                    dot.classList.add('active');
                } else {
                    dot.classList.remove('active');
                }
            });
        }

        function handleInput(val) {
            if (isAuthenticating) {
                return;
            }
            if (val === 'del') {
                currentPin = currentPin.slice(0, -1);
            } else if (val === 'hint') {
                // Hiện popup gợi ý mật khẩu khi bấm nút trái tim
                alert("💡 Gợi ý mật khẩu cho anh iu là 1 ngày quan trọng đối với anh nha ❤️");
                return;
            } else {
                if (currentPin.length < maxLen) {
                    currentPin += val;
                }
            }
            updateDots();

            if (currentPin.length === maxLen) {
                checkPinCode();
            }
        }

        function checkPinCode() {
            const statusMsg = document.getElementById('statusMsg');
            if (isAuthenticating) {
                return;
            }
            if (currentPin.length !== maxLen) {
                statusMsg.textContent = "⚠️ Vui lòng nhập đủ 6 chữ số mã PIN!";
                return;
            }

            isAuthenticating = true;
            if (validPins.includes(currentPin)) {
                statusMsg.style.color = '#38ef7d';
                statusMsg.textContent = "✨ Mật mã chính xác! Đang mở khóa...";
                document.querySelector('.vault-wrapper').classList.add('success-pulse');
                setTimeout(() => {
                    // Chuyển sang trang vault.html sau khi đúng mật khẩu
                    window.location.href = 'vault.html';
                }, 600);
            } else {
                statusMsg.style.color = '#ff4b4b';
                statusMsg.textContent = "❌ Sai mật mã rồi anh iu ơi! Thử lại nha.";
                document.querySelector('.vault-wrapper').classList.add('shake');
                currentPin = "";
                updateDots();
                setTimeout(() => {
                    document.querySelector('.vault-wrapper').classList.remove('shake');
                    statusMsg.style.color = '#8ea4c8';
                    statusMsg.textContent = "Sẵn sàng xác thực mật mã...";
                    isAuthenticating = false;
                }, 800);
            }
        }

        // Bắt sự kiện click các nút trên giao diện
        document.querySelectorAll('.key').forEach(button => {
            button.addEventListener('click', () => {
                handleInput(button.getAttribute('data-val'));
            });
        });

        // Bắt sự kiện bàn phím máy tính
        document.addEventListener('keydown', (e) => {
            if (e.key >= '0' && e.key <= '9') {
                handleInput(e.key);
            } else if (e.key === 'Backspace') {
                handleInput('del');
            } else if (e.key === 'Enter') {
                checkPinCode();
            }
        });

        document.getElementById('unlockBtn').addEventListener('click', () => {
            if (currentPin.length < maxLen) {
                document.getElementById('statusMsg').textContent = "⚠️ Vui lòng nhập đủ 6 chữ số mã PIN!";
            } else {
                checkPinCode();
            }
        });
    </script>
</body>
</html>
